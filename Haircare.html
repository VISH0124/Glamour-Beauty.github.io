<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaLocks Haircare</title>
  <style>
    body {
      background-image:url(haircare\ bg.jpeg);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: #333;
    }
    .header {
      background: #b0e0e6;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin: 0;
      color: #4682b4;
    }
    .main-content {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }
    .product-card {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      border: 1px solid #add8e6;
      width: 200px;
    }
    .product-card img {
      max-width: 100%;
      border-radius: 8px;
      height: 150px;
      object-fit: cover;
    }
    h3 {
      margin: 10px 0 5px;
      color: #5f9ea0;
    }
    .price {
      color: #4682b4;
      font-weight: bold;
    }
    .capacity {
      color: #708090;
      font-size: 0.9em;
    }
    button {
      background: #4682b4;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #5f9ea0;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>AquaLocks Haircare</h1>
</div>

<div class="main-content">
  <div class="product-card">
    <img src="hy shampoo.jpeg" alt="Hydrating Shampoo">
    <h3>Hydrating Shampoo</h3>
    <p class="price">₹849</p>
    <p class="capacity">250ml</p>
    <button>Add to Cart</button>
  </div>

  <div class="product-card">
    <img src="n condi.jpeg" alt="Nourishing Conditioner">
    <h3>Nourishing Conditioner</h3>
    <p class="price">₹799</p>
    <p class="capacity">200ml</p>
    <button>Add to Cart</button>
  </div>

  <div class="product-card">
    <img src="serum.jpeg" alt="Hair Serum">
    <h3>Repairing Hair Serum</h3>
    <p class="price">₹999</p>
    <p class="capacity">150ml</p>
    <button>Add to Cart</button>
  </div>

  <div class="product-card">
    <img src="hair mask.jpg" alt="Hair Mask">
    <h3>Deep Conditioning Mask</h3>
    <p class="price">₹499</p>
    <p class="capacity">150ml</p>
    <button>Add to Cart</button>
  </div>
</div>

</body>
</html>
